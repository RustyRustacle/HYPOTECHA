[build]
builder = "nixpacks"
buildCommand = "npm ci && npm --workspace @hypotheca/sdk run build && npm --workspace @hypotheca/registry run build && npm --workspace @hypotheca/api run build"
watchPatterns = ["apps/api/src/**", "packages/sdk/src/**", "services/registry/src/**", ".env"]

[deploy]
startCommand = "npm --workspace @hypotheca/api run start"
healthcheckPath = "/health"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10